plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.herfy.analytics.kochava'
    compileSdk 34

    defaultConfig {
        minSdk 24
        targetSdk 34
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
            shrinkResources false
        }
        staging {
            debuggable true
            minifyEnabled false
            shrinkResources false
        }
        stagingrelease {
            debuggable false
            minifyEnabled false
            shrinkResources false
        }
        preprod {
            debuggable true
            minifyEnabled false
            shrinkResources false
        }
        prod {
            debuggable true
            minifyEnabled false
            shrinkResources false
        }
        prodrelease {
            debuggable false
            minifyEnabled false
            shrinkResources false
        }
        releaselog {
            debuggable true
            minifyEnabled false
            shrinkResources false
        }
        release {
            debuggable false
            minifyEnabled false
            shrinkResources false
        }
        consumer {
            debuggable true
            minifyEnabled false
            shrinkResources false
        }
        kiosk {
            debuggable true
            minifyEnabled false
            shrinkResources false
        }
        marketing {
            debuggable true
            minifyEnabled false
            shrinkResources false
        }
        merchant {
            debuggable true
            minifyEnabled false
            shrinkResources false
        }
        merchant2 {
            debuggable true
            minifyEnabled false
            shrinkResources false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {

    implementation 'androidx.core:core-ktx:1.9.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    implementation project(':solosdk')
    implementation project(path: ':utils')

    //Kochava
    def kochava_tracker_version = "5.6.0"
    implementation("com.kochava.tracker:tracker:$kochava_tracker_version")
    implementation("com.kochava.tracker:events:$kochava_tracker_version")
    implementation("com.kochava.tracker:engagement:$kochava_tracker_version")
    implementation("com.kochava.tracker:datapointnetwork:$kochava_tracker_version")
    implementation("com.kochava.tracker:legacyreferrer:$kochava_tracker_version")
}