plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-android'
    id 'kotlin-parcelize'
    id 'kotlin-kapt'
}

android {
    namespace 'com.herfy.analytics.firebase'
    compileSdk 36
    defaultConfig {
        minSdk 24
        targetSdk 36
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        debug {
            signingConfig null
            debuggable true
            minifyEnabled false
            shrinkResources false
            buildConfigField "String", "SOLO_APP", "\"0xeF2K8cOYRypcF7\""
        }
        staging {
            debuggable true
            minifyEnabled false
            shrinkResources false
            buildConfigField "String", "SOLO_APP", "\"0xeF2K8cOYRypcF7\""
            //buildConfigField "String", "SOLO_APP", "\"ItfsMIdcuH2vaHsW\"" //Herfy Android - DEV USE ONLY
        }
        //Use this for VAPT builds
        stagingrelease {
            debuggable false
            minifyEnabled false
            shrinkResources false
            buildConfigField "String", "SOLO_APP", "\"0xeF2K8cOYRypcF7\""
        }
        preprod {
            debuggable true
            minifyEnabled false
            shrinkResources false
            buildConfigField "String", "SOLO_APP", "\"gSG2h3Zn9BDutS4B\""
        }
        prod {
            debuggable true
            minifyEnabled false
            shrinkResources false
            buildConfigField "String", "SOLO_APP", "\"gSG2h3Zn9BDutS4B\""
        }
        prodrelease {
            debuggable false
            minifyEnabled false
            shrinkResources false
            buildConfigField "String", "SOLO_APP", "\"gSG2h3Zn9BDutS4B\""
        }
        releaselog {
            debuggable true
            minifyEnabled false
            shrinkResources false
            buildConfigField "String", "SOLO_APP", "\"gSG2h3Zn9BDutS4B\""
        }
        release {
            debuggable false
            minifyEnabled false
            shrinkResources false
            buildConfigField "String", "SOLO_APP", "\"gSG2h3Zn9BDutS4B\""
        }
        consumer {
            debuggable true
            minifyEnabled false
            shrinkResources false
            buildConfigField "String", "SOLO_APP", "\"0xeF2K8cOYRypcF7\""
        }
        kiosk {
            debuggable true
            minifyEnabled false
            shrinkResources false
            buildConfigField "String", "SOLO_APP", "\"0xeF2K8cOYRypcF7\""
        }
        marketing {
            debuggable true
            minifyEnabled false
            shrinkResources false
            buildConfigField "String", "SOLO_APP", "\"0xeF2K8cOYRypcF7\""
        }
        merchant {
            debuggable true
            minifyEnabled false
            shrinkResources false
            buildConfigField "String", "SOLO_APP", "\"0xeF2K8cOYRypcF7\""
        }
        merchant2 {
            debuggable true
            minifyEnabled false
            shrinkResources false
            buildConfigField "String", "SOLO_APP", "\"0xeF2K8cOYRypcF7\""
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

}

dependencies {

    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'


    //Modules
    implementation project(':solosdk')
    implementation project(':utils')
    implementation project(':common')


    //Firebase
    implementation platform('com.google.firebase:firebase-bom:32.7.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-appindexing:20.0.0'
    implementation 'com.google.firebase:firebase-crashlytics'
    implementation 'com.google.firebase:firebase-core:21.1.1'
    implementation 'com.google.firebase:firebase-perf'
    implementation "com.google.firebase:firebase-config:21.2.0"
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-dynamic-links'

    //Retrofit & OKHTTP
    implementation 'com.squareup.okhttp3:okhttp:4.9.3'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.4.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'org.apache.commons:commons-lang3:3.8'
    //Glide
    def glide_version = "4.11.0"
    implementation "com.github.bumptech.glide:glide:$glide_version"
    kapt "com.github.bumptech.glide:compiler:$glide_version"
    //Gson
    implementation 'com.google.code.gson:gson:2.9.0'

    // Hydra Sdk
    implementation("com.capillary:hydra-core:1.0.1")
    // Hydra Sdk
    implementation("com.capillary:hydra-firebase:1.0.1")
    implementation("com.capillary:hydra-pushbase:1.0.1")

}