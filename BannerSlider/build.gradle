apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-parcelize'
apply plugin: 'maven-publish'
apply plugin: 'kotlin-kapt'

android {
    namespace "ss.com.bannerslider"
    compileSdk 36
    defaultConfig {
        minSdk 24
        targetSdk 36
    }
    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
            shrinkResources false
        }
        staging {
            debuggable true
            minifyEnabled false
            shrinkResources false
        }
        stagingrelease {
            debuggable false
            minifyEnabled false
            shrinkResources false
        }
        preprod {
            debuggable true
            minifyEnabled false
            shrinkResources false
        }
        prod {
            debuggable true
            minifyEnabled false
            shrinkResources false
        }
        prodrelease {
            debuggable false
            minifyEnabled false
            shrinkResources false
        }
        releaselog {
            debuggable true
            minifyEnabled false
            shrinkResources false
        }
        release {
            debuggable false
            minifyEnabled false
            shrinkResources false
        }
        consumer {
            debuggable true
            minifyEnabled false
            shrinkResources false
        }
        kiosk {
            debuggable true
            minifyEnabled false
            shrinkResources false
        }
        marketing {
            debuggable true
            minifyEnabled false
            shrinkResources false
        }
        merchant {
            debuggable true
            minifyEnabled false
            shrinkResources false
        }
        merchant2 {
            debuggable true
            minifyEnabled false
            shrinkResources false
        }
    }

    buildFeatures {
        viewBinding = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
}
