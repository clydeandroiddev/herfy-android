plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
    id 'kotlin-parcelize'
}

android {
    namespace 'com.herfy.utils'
    compileSdk 36
    defaultConfig {
        minSdk 24
        targetSdk 36
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
        buildConfigField "String", "TAG", "\"Herfy\""
        buildConfigField "String", "SOLO_CONCEPT", "\"\""
        buildConfigField "String", "SPLASH_COLOR", "\"#FAFBFC\""
        buildConfigField "boolean", "SPLASH_LOGO", "false"
        buildConfigField "boolean", "SPLASH_BACKGROUND", "false"
        buildConfigField "boolean", "SPLASH_VIDEO", "true"
        buildConfigField "boolean", "SPLASH_GIF" , "false"
        buildConfigField "boolean", "ONBOARDING_ENABLED", "true"
        buildConfigField "String", "SOLO_APP_TYPE", "\"Restaurant\""
        buildConfigField "boolean", "SOLO_LOGO", "false"
        buildConfigField "boolean", "FOODICS_LOGO", "true"
        buildConfigField "boolean", "SUBSCRIPTION_ENABLED", "false"
        buildConfigField "String", "TAP_TEST", "\"\""
        buildConfigField "String", "TAP_LIVE", "\"\""
        buildConfigField "boolean", "MULTI_COUNTRY_ENABLED", "false"
        buildConfigField "boolean", "DISABLE_FACEBOOK_LOGIN", "true"
        buildConfigField "boolean", "DISABLE_SPLASH_ANIMATION", "false"
    }

    buildTypes {
        debug {
            signingConfig null
            debuggable true
            minifyEnabled false
            shrinkResources false
            buildConfigField "String", "BASE_URL", "\"https://dev-api.getsolo.io/\""
            buildConfigField "boolean", "DISABLE_FACEBOOK_LOGIN", "false"
            buildConfigField "float", "FEATURE_PHASE", '1.3'
            buildConfigField "String", "MOYASAR_BASE_URL", "\"https://api.moyasar.com\""
            buildConfigField "String", "SOLO_APP", "\"0xeF2K8cOYRypcF7\""
        }
        staging {
            debuggable true
            minifyEnabled false
            shrinkResources false
            buildConfigField "String", "BASE_URL", "\"https://staging-api.getsolo.io/\""
