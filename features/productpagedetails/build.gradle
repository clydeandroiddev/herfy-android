plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-parcelize'
    id 'kotlin-kapt'
    id 'dagger.hilt.android.plugin'
}

android {
    namespace 'com.herfy.productpagedetails'
    compileSdk 36
    defaultConfig {
        minSdk 24
        targetSdk 36
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }
    buildFeatures {
        viewBinding true
        dataBinding true
    }
    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
            shrinkResources false
        }
        staging {
            debuggable true
            minifyEnabled false
            shrinkResources false
        }
        stagingrelease {
            debuggable false
            minifyEnabled false
            shrinkResources false
        }
        preprod {
            debuggable true
            minifyEnabled false
            shrinkResources false
        }
        prod {
            debuggable true
            minifyEnabled false
            shrinkResources false
        }
        prodrelease {
            debuggable false
            minifyEnabled false
            shrinkResources false
        }
        releaselog {
            debuggable true
            minifyEnabled false
            shrinkResources false
        }
        release {
            debuggable false
            minifyEnabled false
            shrinkResources false
        }
        consumer {
            debuggable true
            minifyEnabled false
            shrinkResources false
        }
        kiosk {
            debuggable true
            minifyEnabled false
            shrinkResources false
        }
        marketing {
            debuggable true
            minifyEnabled false
            shrinkResources false
        }
        merchant {
            debuggable true
            minifyEnabled false
            shrinkResources false
        }
        merchant2 {
            debuggable true
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

}

dependencies {

    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation project(':analytics:kochava')
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    //Modules
    implementation project(path: ':data:database')
    implementation project(path: ':data:model')
    implementation project(path: ':data:repository')
    implementation(project(":common"))
    implementation(project(":solosdk"))
    implementation project(path: ':utils')
    implementation project(path: ':analytics:firebase')
    implementation project(path: ':analytics:facebook')

    //ViewModel and LiveData
    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0"

    // Navigation
    def navigation = "2.5.2"
    implementation "androidx.navigation:navigation-fragment:$navigation"
    implementation "androidx.navigation:navigation-fragment-ktx:$navigation"
    implementation "androidx.navigation:navigation-ui:$navigation"
    implementation "androidx.navigation:navigation-ui-ktx:$navigation"
    implementation "androidx.navigation:navigation-dynamic-features-fragment:$navigation"
    androidTestImplementation "androidx.navigation:navigation-testing:$navigation"
    implementation "androidx.navigation:navigation-compose:$navigation"

    //Dagger Hilt
    implementation "com.google.dagger:hilt-android:$dagger_version"
    kapt "com.google.dagger:hilt-android-compiler:$dagger_version"
    kapt('org.jetbrains.kotlinx:kotlinx-metadata-jvm:0.5.0')

    //RXJava
    implementation 'io.reactivex.rxjava2:rxandroid:2.1.0'
    implementation 'io.reactivex.rxjava2:rxjava:2.2.10'

    //Glide
    implementation 'com.github.bumptech.glide:glide:4.14.2'
    kapt 'com.github.bumptech.glide:compiler:4.14.2'

    //FlexBox
    implementation 'com.google.android.flexbox:flexbox:3.0.0'

    //Shimmer
    implementation 'com.facebook.shimmer:shimmer:0.5.0'

    //Gson
    implementation 'com.google.code.gson:gson:2.10.1'

    //Firebase
    implementation platform('com.google.firebase:firebase-bom:32.7.2')

    implementation 'com.google.firebase:firebase-analytics:21.2.0'
    implementation 'com.google.firebase:firebase-crashlytics'
    implementation 'com.google.firebase:firebase-perf'
    implementation 'com.google.firebase:firebase-config'
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-dynamic-links'

    //Kochava Events
    def kochava_tracker_version = "5.4.0"
    implementation("com.kochava.tracker:events:$kochava_tracker_version")

}