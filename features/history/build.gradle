plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-android'
    id 'kotlin-parcelize'
    id 'kotlin-kapt'
    id 'dagger.hilt.android.plugin'
}

android {
    namespace 'com.herfy.history'
    compileSdk 34

    defaultConfig {
        minSdk 24

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildFeatures {
        viewBinding true
    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
            shrinkResources false
        }
        staging {
            debuggable true
            minifyEnabled false
            shrinkResources false
        }
        stagingrelease {
            debuggable false
            minifyEnabled false
            shrinkResources false
        }
        prod {
            debuggable true
            minifyEnabled false
            shrinkResources false
        }
        prodrelease {
            debuggable false
            minifyEnabled false
            shrinkResources false
        }
        releaselog {
            debuggable true
            minifyEnabled false
            shrinkResources false
        }
        release {
            debuggable false
            minifyEnabled false
            shrinkResources false
        }
        consumer {
            debuggable true
            minifyEnabled false
            shrinkResources false
        }
        kiosk {
            debuggable true
            minifyEnabled false
            shrinkResources false
        }
        marketing {
            debuggable true
            minifyEnabled false
            shrinkResources false
        }
        merchant {
            debuggable true
            minifyEnabled false
            shrinkResources false
        }
        merchant2 {
            debuggable true
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        viewBinding true
        dataBinding true
    }
}

dependencies {
    api(project(":commonStyles"))
    api(project(":utils"))
    api(project(":features:home"))
    api(project(":features:ordertype"))

    implementation 'androidx.core:core-ktx:1.8.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation project(path: ':data:database')
    implementation project(path: ':data:model')

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    //Module
    implementation project(':solosdk')
    implementation project(path: ':utils')
    implementation project(path: ':data:database')
    implementation project(path: ':data:repository')
    implementation project(path: ':common')


    //Shimmer
    implementation 'com.facebook.shimmer:shimmer:0.5.0'

    //Gson
    implementation 'com.google.code.gson:gson:2.10.1'

    //Glide
    implementation 'com.github.bumptech.glide:glide:4.14.2'
    kapt 'com.github.bumptech.glide:compiler:4.14.2'

    //ViewModel and LiveData
    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0"

    // Navigation
    def navigation = "2.5.2"
    implementation "androidx.navigation:navigation-fragment:$navigation"
    implementation "androidx.navigation:navigation-fragment-ktx:$navigation"
    implementation "androidx.navigation:navigation-ui:$navigation"
    implementation "androidx.navigation:navigation-ui-ktx:$navigation"
    implementation "androidx.navigation:navigation-dynamic-features-fragment:$navigation"
    androidTestImplementation "androidx.navigation:navigation-testing:$navigation"
    implementation "androidx.navigation:navigation-compose:$navigation"

    //Dagger Hilt
    def dagger_version = "2.48"
    implementation "com.google.dagger:hilt-android:$dagger_version"
    kapt "com.google.dagger:hilt-android-compiler:$dagger_version"
    kapt('org.jetbrains.kotlinx:kotlinx-metadata-jvm:0.5.0')

    //Dot Indicator
    implementation 'com.github.ac-opensource:dotsindicator:5.0.2'

    //RXJava
    implementation 'io.reactivex.rxjava2:rxandroid:2.1.0'
    implementation 'io.reactivex.rxjava2:rxjava:2.2.10'

    //Diagonal Imageview
    implementation 'com.github.santalu:diagonal-imageview:1.1.1'

    //Google
    implementation "com.google.android.gms:play-services-auth:20.2.0"
    implementation "com.google.android.gms:play-services-auth-api-phone:18.0.1"

    //Flexbox
    implementation 'com.google.android.flexbox:flexbox:3.0.0'

    //Rating bar
    implementation 'com.github.ome450901:SimpleRatingBar:1.5.1'
}