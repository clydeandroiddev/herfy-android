        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    useLibrary 'android.test.runner'

    useLibrary 'android.test.base'
    useLibrary 'android.test.mock'

    testOptions {
        unitTests.includeAndroidResources = true
    }
    lint {
        disable 'RestrictedApi'
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def buildType = variant.buildType.name
            def versionName = variant.versionName
            def flavor = variant.flavorName
            if(buildType == "kiosk") {
                output.setVersionCodeOverride(1)
            } else if(buildType == "staging") {
                output.setVersionCodeOverride(2)
            } else if(buildType == "prodrelease") {
                output.setVersionCodeOverride(3)
            } else if(buildType == "releaselog") {
                output.setVersionCodeOverride(4)
            }
            outputFileName = "${flavor}-${buildType}-v${versionName}(${versionCode})-${new Date().format('yyyy.MM.dd.hh.mm.aa')}.apk"
        }
    }
