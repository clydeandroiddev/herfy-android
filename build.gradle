// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    ext.kotlin_version = '1.8.20'


    repositories {
        google()
        mavenCentral()
        maven {
            url "https://plugins.gradle.org/m2/"
        }

    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.5.2'
        classpath 'com.google.gms:google-services:4.3.15'
        classpath 'com.google.firebase:firebase-crashlytics-gradle:2.9.4'
        classpath 'com.google.firebase:perf-plugin:1.4.2'
        classpath 'com.jakewharton:butterknife-gradle-plugin:10.2.3'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath 'com.github.dcendents:android-maven-gradle-plugin:2.1'
        //classpath "org.jetbrains.kotlin:kotlin-android-extensions:$kotlin_version"
        classpath 'androidx.navigation:navigation-safe-args-gradle-plugin:2.5.3'
        classpath "com.google.dagger:hilt-android-gradle-plugin:2.48"
        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        kotlinOptions {
            jvmTarget = "17"
        }
    }

    def githubProps = new Properties()
    def githubPropsFile = rootProject.file("github.properties")
    if (githubPropsFile.exists()) {
        githubProps.load(new FileInputStream(githubPropsFile))
    }

    repositories {
        google()
        flatDir {
            dirs 'libs'
        }
        maven {
            url 'https://jitpack.io'
        }
        maven {
            url "https://plugins.gradle.org/m2/"
        }
        maven {
            url "https://repository.liferay.com/nexus/content/repositories/public/"
        }
        maven {
            url "https://repo.spring.io/plugins-release/"
        }
        maven {
            url "https://maven.pkg.github.com/Capillary/hydra-sdk-android-maven"
            credentials {
                username = githubProps['username']
                password = githubProps['token']
            }
        }

    }
}



task clean(type: Delete) {
    delete rootProject.buildDir
}